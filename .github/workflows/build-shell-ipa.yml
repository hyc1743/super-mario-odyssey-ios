name: build nxnative ipa

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build in this public repository: shell only, or personal 1.4.1 IPA with external resources'
        type: choice
        options: [shell, personal]
        default: shell
      input_tag:
        description: 'Private input release tag'
        default: nxnative-inputs-1.4.1
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Package boundaries and portable resource tools
    # All macOS work runs in the public source repository. The private
    # repository is release storage only and never runs this workflow.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s smo/nxnative/tests -v

  shell:
    name: Public shell (no game inputs)
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dependencies
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$RUNNER_TEMP"
          brew install xcodegen
          python -m pip install fonttools
      - name: Native resource validator regression tests
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fblocks -Wno-deprecated-declarations \
            -framework Foundation -Ismo/nxnative smo/nxnative/SMOResources.m \
            smo/nxnative/tests/resources_test.m -o "$RUNNER_TEMP/resource-tests"
          "$RUNNER_TEMP/resource-tests"
      - name: Build without NSPs, keys or generated game data
        run: python scripts/build_nxnative_ipa.py --mode shell --output out/nxnative-shell
      - uses: actions/upload-artifact@v4
        with:
          name: SMOMobile-nxnative-shell
          path: |
            out/nxnative-shell/SMOMobile-shell.ipa
            out/nxnative-shell/build_report.json
            out/nxnative-shell/thin_ipa_report.json
          if-no-files-found: error
      - name: Shell build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-shell-build-logs
          path: out/nxnative-shell/work/logs
          if-no-files-found: ignore

  personal:
    name: Public macOS build (personal IPA and external resources)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'personal'
    needs: verify
    runs-on: macos-26
    timeout-minutes: 180
    env:
      PRIVATE_STORAGE_REPO: hyc1743/super-mario-odyssey-ios-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build dependencies
        run: |
          echo "Build execution repository: $GITHUB_REPOSITORY (public). Private repository is file storage only."
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$RUNNER_TEMP"
          brew install xcodegen zstd spirv-cross
          xcodebuild -downloadComponent MetalToolchain
          python -m pip install lz4 capstone fonttools
      - name: Fetch private user-owned inputs
        env:
          SMO_PRIVATE_TOKEN: ${{ secrets.SMO_PRIVATE_TOKEN }}
          SMO_PROD_KEYS: ${{ secrets.SMO_PROD_KEYS }}
          INPUT_TAG: ${{ inputs.input_tag }}
        run: |
          python scripts/nxnative_github.py --private-repo "$PRIVATE_STORAGE_REPO" fetch-inputs \
            --input-tag "$INPUT_TAG" --destination "$RUNNER_TEMP/nxnative-inputs"
      - name: Build personal IPA and external resource parts
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/nxnative-personal"
          python scripts/build_nxnative_ipa.py --mode personal \
            --base-nsp "$RUNNER_TEMP/nxnative-inputs/base.nsp" \
            --update-nsp "$RUNNER_TEMP/nxnative-inputs/update.nsp" \
            --keys "$RUNNER_TEMP/nxnative-inputs/prod.keys" \
            --discard-runner-inputs --output "$RUNNER_TEMP/nxnative-personal" \
            > "$RUNNER_TEMP/nxnative-personal/build-console.log" 2>&1 &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            echo "Personal build running. Detailed logs remain private."
            sleep 30
          done
          wait "$build_pid"
          exit $?
      - name: Store personal output in the private release repository
        env:
          SMO_PRIVATE_TOKEN: ${{ secrets.SMO_PRIVATE_TOKEN }}
        run: |
          python scripts/nxnative_github.py --private-repo "$PRIVATE_STORAGE_REPO" publish \
            --directory "$RUNNER_TEMP/nxnative-personal" --tag "nxnative-${{ github.run_id }}"
      - name: Publish private build logs
        if: always()
        env:
          SMO_PRIVATE_TOKEN: ${{ secrets.SMO_PRIVATE_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/nxnative-personal"
          python scripts/nxnative_github.py --private-repo "$PRIVATE_STORAGE_REPO" publish --logs-only \
            --directory "$RUNNER_TEMP/nxnative-personal" --tag "nxnative-${{ github.run_id }}"
      - name: Remove temporary keys
        if: always()
        run: rm -f "$RUNNER_TEMP/nxnative-inputs/prod.keys"
